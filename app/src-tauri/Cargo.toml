[package]
name = "ikun-px"
version = "0.6.10"
description = "An independent MarsLink-compatible desktop client"
authors = ["IKUN PX"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ikun_px_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
rand = "0.10.2"
bytes = "1.12.1"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
regex = "1.13.1"
winreg = "0.56.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"

[[example]]
name = "verify"
path = "examples/verify.rs"

